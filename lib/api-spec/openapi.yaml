openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: foundation
    description: Phase 1 foundation and configuration
  - name: catalog
    description: Public catalog and reference data
  - name: pricing
    description: Rule-based pricing recommendations
  - name: demo
    description: Deterministic demo data for the SIH presentation flow
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /foundation/status:
    get:
      operationId: getFoundationStatus
      tags: [foundation]
      summary: Get application foundation status
      responses:
        "200":
          description: Foundation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundationStatus"
  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: List craft categories
      responses:
        "200":
          description: Craft categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /marketplace/products:
    get:
      operationId: listMarketplaceProducts
      tags: [catalog]
      summary: List published products for marketplace discovery
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
      responses:
        "200":
          description: Published products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceProduct"
  /products/{productId}/pricing-recommendation:
    post:
      operationId: createPricingRecommendation
      tags: [pricing]
      summary: Create a rule-based pricing recommendation
      description: Calculates and persists a transparent recommendation using product data and seeded market references when available.
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingRecommendationInput"
      responses:
        "201":
          description: Pricing recommendation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingRecommendation"
        "400":
          description: Invalid pricing inputs
        "404":
          description: Product not found
  /demo/overview:
    get:
      operationId: getDemoOverview
      tags: [demo]
      summary: Get deterministic demo overview
      responses:
        "200":
          description: Demo overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoOverview"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    FoundationStatus:
      type: object
      required:
        - appName
        - tagline
        - phase
        - authProvider
        - dataProvider
        - aiMode
        - roles
        - supportedLanguages
        - storageBuckets
      properties:
        appName:
          type: string
        tagline:
          type: string
        phase:
          type: string
        authProvider:
          type: string
        dataProvider:
          type: string
        aiMode:
          type: string
        roles:
          type: array
          items:
            type: string
        supportedLanguages:
          type: array
          items:
            type: string
        storageBuckets:
          type: array
          items:
            type: string
    Category:
      type: object
      required:
        - id
        - name
        - nameHindi
        - icon
        - productCount
      properties:
        id:
          type: string
        name:
          type: string
        nameHindi:
          type: string
        icon:
          type: string
        productCount:
          type: integer
    MarketplaceProduct:
      type: object
      required:
        - id
        - title
        - titleHindi
        - category
        - craft
        - region
        - price
        - quantity
        - artisanName
        - imageUrl
      properties:
        id:
          type: string
        title:
          type: string
        titleHindi:
          type: string
        category:
          type: string
        craft:
          type: string
        region:
          type: string
        price:
          type: number
        quantity:
          type: integer
        artisanName:
          type: string
        imageUrl:
          type: string
        imageAlt:
          type: string
        status:
          type: string
    PricingRecommendationInput:
      type: object
      additionalProperties: false
      properties:
        currentPrice:
          type: number
          minimum: 0
          description: Optional price override; defaults to the product price.
        quantity:
          type: integer
          minimum: 0
          description: Optional inventory override; defaults to the product quantity.
        craft:
          type: string
          minLength: 1
          description: Optional craft override; defaults to the product craft.
        material:
          type: string
          minLength: 1
          description: Optional material override; defaults to the product material.
        region:
          type: string
          minLength: 1
          description: Optional region override; defaults to the product region.
    PricingRecommendation:
      type: object
      required:
        - id
        - productId
        - minimumPrice
        - recommendedPrice
        - maximumPrice
        - confidence
        - reasoning
        - marketReferenceCount
      properties:
        id:
          type: string
        productId:
          type: string
        minimumPrice:
          type: number
        recommendedPrice:
          type: number
        maximumPrice:
          type: number
        confidence:
          type: string
          enum: [low, medium, high]
        reasoning:
          type: string
        marketReferenceCount:
          type: integer
          minimum: 0
    DemoArtisan:
      type: object
      required:
        - name
        - craft
        - region
        - experienceYears
        - initials
      properties:
        name:
          type: string
        craft:
          type: string
        region:
          type: string
        experienceYears:
          type: integer
        initials:
          type: string
    DemoOverview:
      type: object
      required:
        - artisan
        - publishedProducts
        - draftCount
        - unreadNotifications
        - nextPhase
      properties:
        artisan:
          $ref: "#/components/schemas/DemoArtisan"
        publishedProducts:
          type: integer
        draftCount:
          type: integer
        unreadNotifications:
          type: integer
        nextPhase:
          type: string

